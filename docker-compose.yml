version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: chatiq-server
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=ChatIQ
      - APP_VERSION=1.0.0
      - DEBUG=True
      - ENVIRONMENT=development
      - HOST=0.0.0.0
      - PORT=8000
      - ALLOWED_HOSTS=["*"]
      - FRONTEND_URL=http://localhost:3001
      - WAHA_BASE_URL=http://waha:3000/api
    env_file:
      - ./server/.env
    volumes:
      - ./server:/app
      - /app/.venv
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    depends_on:
      - waha
    networks:
      - chatiq-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: chatiq-client
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://server:8000
    restart: unless-stopped
    depends_on:
      - server
    networks:
      - chatiq-network

  waha:
    image: devlikeapro/waha
    container_name: chatiq-waha
    restart: always
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - ./.sessions:/app/.sessions
    networks:
      - chatiq-network

networks:
  chatiq-network:
    driver: bridge
